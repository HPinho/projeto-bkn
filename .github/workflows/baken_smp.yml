name: Baken OS SMP Bring-up Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smp-bringup:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install System Dependencies & QEMU
        timeout-minutes: 20
        run: |
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -f "$ubuntu_sources"
          apt_retry() {
            local attempt=1
            while ! timeout --foreground 6m sudo apt-get \
              -o "Dir::Etc::sourcelist=${ubuntu_sources}" \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::Retries=5 "$@"; do
              if test "$attempt" -ge 3; then
                echo "::error::apt-get $1 failed after $attempt attempts."
                return 1
              fi
              echo "::warning::apt-get $1 attempt $attempt failed; retrying in 10 seconds."
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          apt_retry update
          apt_retry install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64

      - name: Verify SMP Contracts
        run: |
          python3 tests/test_kernel_smp_base.py
          python3 tests/test_kernel_smp_runtime.py
          python3 tests/test_kernel_smp_scheduler_dispatch.py
          python3 tests/test_kernel_smp_timer_preemption.py
          python3 tests/test_kernel_smp_heap.py
          python3 tests/test_kernel_smp_tlb_shootdown.py
          python3 tests/test_active_address_space_tracking.py
          python3 tests/test_kernel_smp_ring3.py
          python3 tests/test_kernel_switch_commit.py
          python3 tests/test_local_smp_runner.py
          python3 tests/test_process_smp_tlb_coherence.py
          python3 tests/test_kernel_smp_process_migration.py
          python3 tests/test_kernel_user_fault_isolation.py
          python3 tests/test_acpi_aml_tables.py
          python3 tests/test_acpi_aml_decoder.py
          python3 tests/test_acpi_aml_data.py
          python3 tests/test_acpi_aml_namespace.py
          python3 tests/test_acpi_aml_loader.py
          python3 tests/test_acpi_aml_discovery.py
          python3 tests/test_acpi_aml_evaluator.py
          python3 tests/test_acpi_aml_dynamic_discovery.py
          python3 tests/test_hid_report_descriptor.py
          python3 tests/test_input_device.py
          python3 tests/test_input_event.py
          python3 tests/test_hid_input_events.py
          python3 tests/test_xhci_hid_descriptor.py
          python3 tests/test_xhci_hid_report.py
          python3 tests/test_hid4_runtime_contract.py
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build Native Sotlas UEFI Kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-main.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Prove AP Dispatch, Heap, TLB, Ring3 Migration and FPU Context
        # Tres boots independentes: todos devem provar os contratos de SMP.
        # Uma falha encerra o gate; nao e uma retentativa para esconder corridas.
        timeout-minutes: 18
        shell: bash
        run: |
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          for proof in 1 2 3; do
          echo "SMP proof ${proof}/3 revision $(git rev-parse HEAD)"
          cp "$OVMF_VARS" build/OVMF_VARS_SMP.fd
          rm -f build/qemu-smp-serial.log

          qemu-system-x86_64 \
            -machine q35 -smp 2 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS_SMP.fd \
            -cdrom build/baken_os.iso \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none \
            -monitor none \
            -serial file:build/qemu-smp-serial.log &
          qemu_pid=$!

          found=0
          stop_reason=timeout
          for i in $(seq 1 3000); do
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:SMP_FPU_MIGRATION_READY' build/qemu-smp-serial.log; then
              found=1
              stop_reason=complete
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fq 'BAKEN:HEX=A:' build/qemu-smp-serial.log; then
              stop_reason=aml-loader-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fq 'BAKEN:HEX=R:' build/qemu-smp-serial.log; then
              stop_reason=aml-discovery-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:ACPI_AML_EVALUATOR_FAILED' build/qemu-smp-serial.log; then
              stop_reason=aml-evaluator-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:ACPI_AML_DYNAMIC_FAILED' build/qemu-smp-serial.log; then
              stop_reason=aml-dynamic-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:USB_HID_DESCRIPTOR_FAILED' build/qemu-smp-serial.log; then
              stop_reason=usb-hid-descriptor-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:USB_HID_INPUT_MAP_FAILED' build/qemu-smp-serial.log; then
              stop_reason=usb-hid-input-map-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:USB_HID_EVENT_MODEL_FAILED' build/qemu-smp-serial.log; then
              stop_reason=usb-hid-event-model-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:USB_HID_DEVICE_FAILED' build/qemu-smp-serial.log; then
              stop_reason=usb-hid-device-failure
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fq 'BAKEN:HEX=E:' build/qemu-smp-serial.log; then
              stop_reason=cpu-exception
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Eq '^BAKEN:HEX=Q:8[0-9A-Fa-f]{7}$' build/qemu-smp-serial.log; then
              stop_reason=ring3-probe-failure
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              stop_reason=qemu-exited
              break
            fi
            sleep 0.1
          done

          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          test -f build/qemu-smp-serial.log
          cp build/qemu-smp-serial.log "build/qemu-smp-serial-${proof}.log"
          cat build/qemu-smp-serial.log
          echo "SMP proof ${proof}: stop_reason=${stop_reason}"
          if test "$stop_reason" != complete; then
            checkpoint=$(grep -E '^BAKEN:HEX=Q:' build/qemu-smp-serial.log | tail -n 1 || true)
            platform_error=$(grep -E '^BAKEN:(ACPI_AML_(EVALUATOR|DYNAMIC)_FAILED|USB_HID_(DESCRIPTOR|INPUT_MAP|EVENT_MODEL|DEVICE)_FAILED|HEX=[ABRS]:)' build/qemu-smp-serial.log | tail -n 8 || true)
            echo "::error::SMP stopped: ${stop_reason}; Ring3/TLB checkpoint=${checkpoint:-none}. Q stages: 1=publication, 2=remap, 3=resume, 4=reaper, 5=idle, 6=syscalls, 7/8/9=unmap, A=cleanup; bit31=failure."
            if test -n "$platform_error"; then echo "::error::Platform diagnostics: $platform_error"; fi
          fi
          python3 tools/scripts/run_smp_qemu.py --validate-log build/qemu-smp-serial.log
          if grep -Fq 'BAKEN:HEX=E:' build/qemu-smp-serial.log; then
            echo '::error::CPU exception reported during SMP/heap/TLB/Ring3/FPU migration proof.'
            exit 1
          fi
          if grep -Fxq 'BAKEN:HEX=J:00000001' build/qemu-smp-serial.log; then
            echo '::error::scheduler_initialize() failed before the first SMP context switch.'
            exit 1
          fi
          if grep -Fxq 'BAKEN:HEX=J:00000002' build/qemu-smp-serial.log; then
            echo '::error::Scheduler initialized, but the BSP never completed its first IRQ round-trip.'
            exit 1
          fi
          if ! grep -Fxq 'BAKEN:SCHEDULER_INITIALIZED' build/qemu-smp-serial.log; then
            echo '::error::Kernel stalled between FPU_CONTEXT_READY and scheduler initialization diagnostics.'
            exit 1
          fi
          require_marker() {
            if ! grep -Fxq "$1" build/qemu-smp-serial.log; then
              echo "::error::Missing $1 in SMP QEMU proof."
              migration_stage=$(grep -E '^BAKEN:HEX=M:[0-9A-Fa-f]{8}$' build/qemu-smp-serial.log | tail -n 1 || true)
              if test -n "$migration_stage"; then
                echo "::error::Last migration checkpoint: $migration_stage (1=start, 2=process, 3=mappings, 4=thread, 5=repin, 6=IPI, 7=AP/root, 8=FPU result, 9=reaped, A=cleanup)."
              fi
              echo '--- last Baken checkpoints ---' >&2
              grep -Eo 'BAKEN:[^[:space:]]+' build/qemu-smp-serial.log | tail -n 64 >&2 || true
              exit 1
            fi
          }
          require_marker 'BAKEN:SMP_BASE_READY'
          require_marker 'BAKEN:ACPI_AML_TABLES_READY'
          require_marker 'BAKEN:ACPI_AML_DECODER_READY'
          require_marker 'BAKEN:ACPI_AML_DATA_READY'
          require_marker 'BAKEN:ACPI_AML_NAMESPACE_READY'
          require_marker 'BAKEN:ACPI_AML_NAMESPACE_LOADED'
          require_marker 'BAKEN:ACPI_AML_DEVICES_READY'
          require_marker 'BAKEN:ACPI_AML_EVALUATOR_READY'
          require_marker 'BAKEN:ACPI_AML_DYNAMIC_READY'
          require_marker 'BAKEN:USB_HID_DESCRIPTOR_READY'
          require_marker 'BAKEN:USB_HID_INPUT_MAP_READY'
          require_marker 'BAKEN:USB_HID_EVENT_MODEL_READY'
          require_marker 'BAKEN:USB_HID_DEVICE_READY'
          require_marker 'BAKEN:SMP_AP_ONLINE'
          require_marker 'BAKEN:SMP_AP_RUNTIME_READY'
          require_marker 'BAKEN:SMP_THREAD_ON_AP'
          require_marker 'BAKEN:SMP_TIMER_ON_AP'
          require_marker 'BAKEN:SMP_ANY_THREAD_ON_AP'
          require_marker 'BAKEN:SMP_HEAP_READY'
          require_marker 'BAKEN:SMP_TLB_SHOOTDOWN_READY'
          require_marker 'BAKEN:SMP_RING3_ON_AP'
          require_marker 'BAKEN:SMP_RING3_RESUMED_ON_AP'
          require_marker 'BAKEN:SMP_PROCESS_TLB_READY'
          require_marker 'BAKEN:SMP_RING3_ON_AP_READY'
          require_marker 'BAKEN:SMP_PROCESS_MIGRATED'
          require_marker 'BAKEN:SMP_FPU_MIGRATION_READY'
          require_marker 'BAKEN:USER_FAULT_ISOLATED_READY'
          require_marker 'BAKEN:SMP_USER_FAULT_ISOLATED_READY'
          test "$found" -eq 1
          done

      - name: Upload SMP diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-smp-diagnostics
          path: build/qemu-smp-serial*.log
          if-no-files-found: warn
          retention-days: 7
