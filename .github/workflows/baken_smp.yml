name: Baken OS SMP Bring-up Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  smp-bringup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & QEMU
        timeout-minutes: 10
        run: |
          timeout --foreground 4m sudo apt-get -o Acquire::Retries=3 update
          timeout --foreground 6m sudo apt-get -o Acquire::Retries=3 install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64

      - name: Verify SMP Contracts
        run: |
          python3 tests/test_kernel_smp_base.py
          python3 tests/test_kernel_smp_runtime.py
          python3 tests/test_kernel_smp_scheduler_dispatch.py
          python3 tests/test_kernel_smp_timer_preemption.py
          python3 tests/test_kernel_smp_heap.py
          python3 tests/test_kernel_smp_tlb_shootdown.py
          python3 tests/test_active_address_space_tracking.py
          python3 tests/test_kernel_smp_ring3.py
          python3 tests/test_process_smp_tlb_coherence.py
          python3 tests/test_kernel_smp_process_migration.py
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build Native Sotlas UEFI Kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-main.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Prove AP Dispatch, Heap, TLB, Ring3 Migration and FPU Context
        timeout-minutes: 4
        shell: bash
        run: |
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          cp "$OVMF_VARS" build/OVMF_VARS_SMP.fd
          rm -f build/qemu-smp-serial.log

          qemu-system-x86_64 \
            -machine q35 -smp 2 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS_SMP.fd \
            -cdrom build/baken_os.iso \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none \
            -monitor none \
            -serial file:build/qemu-smp-serial.log &
          qemu_pid=$!

          found=0
          for i in $(seq 1 1200); do
            if test -f build/qemu-smp-serial.log && grep -Fxq 'BAKEN:SMP_FPU_MIGRATION_READY' build/qemu-smp-serial.log; then
              found=1
              break
            fi
            if test -f build/qemu-smp-serial.log && grep -Fq 'BAKEN:HEX=E:' build/qemu-smp-serial.log; then
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              break
            fi
            sleep 0.1
          done

          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          test -f build/qemu-smp-serial.log
          cat build/qemu-smp-serial.log
          if grep -Fq 'BAKEN:HEX=E:' build/qemu-smp-serial.log; then
            echo '::error::CPU exception reported during SMP/heap/TLB/Ring3/FPU migration proof.'
            exit 1
          fi
          if grep -Fxq 'BAKEN:HEX=J:00000001' build/qemu-smp-serial.log; then
            echo '::error::scheduler_initialize() failed before the first SMP context switch.'
            exit 1
          fi
          if grep -Fxq 'BAKEN:HEX=J:00000002' build/qemu-smp-serial.log; then
            echo '::error::Scheduler initialized, but the BSP never completed its first IRQ round-trip.'
            exit 1
          fi
          if ! grep -Fxq 'BAKEN:SCHEDULER_INITIALIZED' build/qemu-smp-serial.log; then
            echo '::error::Kernel stalled between FPU_CONTEXT_READY and scheduler initialization diagnostics.'
            exit 1
          fi
          require_marker() {
            if ! grep -Fxq "$1" build/qemu-smp-serial.log; then
              echo "::error::Missing $1 in SMP QEMU proof."
              echo '--- last Baken checkpoints ---' >&2
              grep -Eo 'BAKEN:[^[:space:]]+' build/qemu-smp-serial.log | tail -n 48 >&2 || true
              exit 1
            fi
          }
          require_marker 'BAKEN:SMP_BASE_READY'
          require_marker 'BAKEN:SMP_AP_ONLINE'
          require_marker 'BAKEN:SMP_AP_RUNTIME_READY'
          require_marker 'BAKEN:SMP_THREAD_ON_AP'
          require_marker 'BAKEN:SMP_TIMER_ON_AP'
          require_marker 'BAKEN:SMP_ANY_THREAD_ON_AP'
          require_marker 'BAKEN:SMP_HEAP_READY'
          require_marker 'BAKEN:SMP_TLB_SHOOTDOWN_READY'
          require_marker 'BAKEN:SMP_RING3_ON_AP'
          require_marker 'BAKEN:SMP_RING3_RESUMED_ON_AP'
          require_marker 'BAKEN:SMP_PROCESS_TLB_READY'
          require_marker 'BAKEN:SMP_RING3_ON_AP_READY'
          require_marker 'BAKEN:SMP_PROCESS_MIGRATED'
          require_marker 'BAKEN:SMP_FPU_MIGRATION_READY'
          require_marker 'BAKEN:USER_FAULT_ISOLATED_READY'
          test "$found" -eq 1

      - name: Upload SMP diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-smp-diagnostics
          path: build/qemu-smp-serial.log
          if-no-files-found: warn
          retention-days: 7
