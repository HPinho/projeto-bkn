name: Baken OS MSI EDU Runtime Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  msi-edu-runtime:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install QEMU and Sotlas build dependencies
        timeout-minutes: 20
        run: |
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -f "$ubuntu_sources"
          apt_retry() {
            local attempt=1
            while ! timeout --foreground 6m sudo apt-get \
              -o "Dir::Etc::sourcelist=${ubuntu_sources}" \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::Retries=5 "$@"; do
              if test "$attempt" -ge 3; then
                echo "::error::apt-get $1 failed after $attempt attempts."
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          apt_retry update
          apt_retry install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64

      - name: Verify DF-6d2 structural contracts
        run: |
          python3 tests/test_pci_msi_edu_proof.py

      - name: Instrument CI-only EDU proof
        shell: bash
        run: |
          cp tests/fixtures/df6d2/pci_msi_edu_proof.sotlas \
             kernel/src/drivers/pci_msi_edu_proof.sotlas
          python3 - <<'PY'
          from pathlib import Path

          path = Path("kernel/src/baken_native_runtime.sotlas")
          text = path.read_text(encoding="utf-8")

          import_anchor = "import kernel::device::foundation_self_test::*;\n"
          assert text.count(import_anchor) == 1
          text = text.replace(
              import_anchor,
              import_anchor + "import kernel::drivers::pci_msi_edu_proof::*;\n",
              1,
          )

          call_anchor = (
              '    if !device_foundation_emit_ready_marker() && x86_serial_is_ready() {\n'
              '        baken_early_boot_fail("E-DF-MARKER\\0".as_ptr(), '
              '"DRIVER FOUNDATION SERIAL MARKER\\0".as_ptr());\n'
              '    }\n'
          )
          assert text.count(call_anchor) == 1
          proof = (
              '\n'
              '    // CI-only DF-6d2: QEMU EDU proves real MSI delivery + teardown.\n'
              '    baken_early_boot_stage("PCI MSI EDU RUNTIME PROOF\\0".as_ptr());\n'
              '    if !pci_msi_edu_runtime_proof() {\n'
              '        baken_early_boot_fail("E-MSI-EDU\\0".as_ptr(), '
              '"PCI MSI EDU RUNTIME PROOF\\0".as_ptr());\n'
              '    }\n'
          )
          text = text.replace(call_anchor, call_anchor + proof, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq 'import kernel::drivers::pci_msi_edu_proof::*;' \
            kernel/src/baken_native_runtime.sotlas
          grep -Fq 'pci_msi_edu_runtime_proof()' \
            kernel/src/baken_native_runtime.sotlas

      - name: Verify instrumented Sotlas kernel graph
        run: |
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build instrumented native Sotlas UEFI kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-msi-edu.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"

      - name: Build UEFI ISO image
        run: |
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Prove real MSI delivery and source-off teardown on QEMU EDU
        timeout-minutes: 3
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          echo "MSI EDU proof revision $(git rev-parse HEAD)"
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          cp "$OVMF_VARS" build/OVMF_VARS_MSI_EDU.fd
          rm -f build/qemu-msi-edu-serial.log

          qemu-system-x86_64 \
            -machine q35 -smp 2 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS_MSI_EDU.fd \
            -cdrom build/baken_os.iso \
            -device edu \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none \
            -monitor none \
            -serial file:build/qemu-msi-edu-serial.log &
          qemu_pid=$!

          found=0
          stop_reason=timeout
          for i in $(seq 1 1200); do
            if test -f build/qemu-msi-edu-serial.log &&
               grep -Fxq 'BAKEN:PCI_MSI_EDU_READY' build/qemu-msi-edu-serial.log; then
              found=1
              stop_reason=complete
              break
            fi
            if test -f build/qemu-msi-edu-serial.log &&
               grep -Fq 'E-MSI-EDU' build/qemu-msi-edu-serial.log; then
              stop_reason=msi-edu-failure
              break
            fi
            if test -f build/qemu-msi-edu-serial.log &&
               grep -Fq 'BAKEN:HEX=E:' build/qemu-msi-edu-serial.log; then
              stop_reason=cpu-exception
              break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              stop_reason=qemu-exited
              break
            fi
            sleep 0.1
          done

          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          test -f build/qemu-msi-edu-serial.log
          cat build/qemu-msi-edu-serial.log
          echo "MSI EDU proof: stop_reason=${stop_reason}"

          grep -Fxq 'BAKEN:DRIVER_FOUNDATION_READY' build/qemu-msi-edu-serial.log
          grep -Fxq 'BAKEN:PCI_MSI_EDU_READY' build/qemu-msi-edu-serial.log
          if grep -Fq 'BAKEN:HEX=E:' build/qemu-msi-edu-serial.log; then
            echo '::error::CPU exception reported during MSI EDU proof.'
            exit 1
          fi
          test "$found" -eq 1

      - name: Upload MSI EDU diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-msi-edu-diagnostics
          path: |
            build/qemu-msi-edu-serial.log
            build/sotlas-msi-edu.manifest.json
          if-no-files-found: warn
          retention-days: 7
