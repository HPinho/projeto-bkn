name: Baken OS HID Dual-device Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  hid-dual-runtime:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install QEMU and Sotlas build dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64 socat

      - name: Verify HID multi-device contracts
        run: |
          python3 tests/test_hid_dual_runtime.py
          python3 tests/test_xhci_transfer.py
          python3 tests/test_xhci_hid_report.py
          python3 tests/test_xhci_hid_hotplug_runtime.py
          python3 tests/test_xhci_hid_context_rollback.py
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build Native Sotlas UEFI Kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-hid-dual.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"

      - name: Build UEFI ISO Image
        run: |
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Prove keyboard/mouse interleaving and hotplug reuse on independent xHCI slots
        timeout-minutes: 4
        shell: bash
        run: |
          command -v socat
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          cp "$OVMF_VARS" build/OVMF_VARS_HID_DUAL.fd
          rm -f build/qemu-hid-dual.sock build/qemu-hid-dual.log

          set +e
          timeout --signal=TERM --kill-after=5s 150s qemu-system-x86_64 \
            -machine q35 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS_HID_DUAL.fd \
            -cdrom build/baken_os.iso \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0,id=kbd0 \
            -device usb-mouse,bus=xhci.0,id=mouse0 \
            -display none \
            -monitor unix:build/qemu-hid-dual.sock,server=on,wait=off \
            -serial file:build/qemu-hid-dual.log &
          qemu_pid=$!
          set -e

          for i in $(seq 1 100); do
            test -S build/qemu-hid-dual.sock && break
            sleep 0.1
          done
          test -S build/qemu-hid-dual.sock

          interleave_seen=0
          injection_failed=0
          for i in $(seq 1 600); do
            if ! printf 'sendkey a\nmouse_move 5 3\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1; then
              injection_failed=1
              break
            fi
            if grep -q 'BAKEN:USB_HID_INTERLEAVE_READY' build/qemu-hid-dual.log 2>/dev/null; then
              interleave_seen=1
              break
            fi
            sleep 0.2
          done

          runtime_ready=0
          if test "$interleave_seen" -eq 1; then
            for i in $(seq 1 300); do
              if grep -q 'BAKEN:USB_HID_HOTPLUG_RUNTIME_READY' build/qemu-hid-dual.log 2>/dev/null; then
                runtime_ready=1
                break
              fi
              sleep 0.1
            done
          fi

          hotplug_failed=0
          if test "$runtime_ready" -eq 1; then
            if ! printf 'device_del mouse0\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1; then
              hotplug_failed=1
            fi
          else
            hotplug_failed=1
          fi

          detach_one=0
          if test "$hotplug_failed" -eq 0; then
            for i in $(seq 1 200); do
              detach_count="$(grep -c 'BAKEN:USB_HID_HOTPLUG_DETACH_READY' build/qemu-hid-dual.log 2>/dev/null || true)"
              if test "$detach_count" -ge 1; then
                detach_one=1
                break
              fi
              sleep 0.1
            done
          fi

          reconnect_one=0
          if test "$detach_one" -eq 1; then
            if ! printf 'device_add usb-mouse,bus=xhci.0,id=mouse1\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1; then
              hotplug_failed=1
            else
              for i in $(seq 1 200); do
                printf 'mouse_move 3 2\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1 || true
                reconnect_count="$(grep -c 'BAKEN:USB_HID_HOTPLUG_RECONNECT_READY' build/qemu-hid-dual.log 2>/dev/null || true)"
                if test "$reconnect_count" -ge 1; then
                  reconnect_one=1
                  break
                fi
                sleep 0.1
              done
            fi
          fi

          detach_two=0
          if test "$reconnect_one" -eq 1; then
            if ! printf 'device_del mouse1\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1; then
              hotplug_failed=1
            else
              for i in $(seq 1 200); do
                detach_count="$(grep -c 'BAKEN:USB_HID_HOTPLUG_DETACH_READY' build/qemu-hid-dual.log 2>/dev/null || true)"
                if test "$detach_count" -ge 2; then
                  detach_two=1
                  break
                fi
                sleep 0.1
              done
            fi
          fi

          reconnect_two=0
          if test "$detach_two" -eq 1; then
            if ! printf 'device_add usb-mouse,bus=xhci.0,id=mouse2\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1; then
              hotplug_failed=1
            else
              for i in $(seq 1 200); do
                printf 'mouse_move 4 1\n' | socat - UNIX-CONNECT:build/qemu-hid-dual.sock >/dev/null 2>&1 || true
                reconnect_count="$(grep -c 'BAKEN:USB_HID_HOTPLUG_RECONNECT_READY' build/qemu-hid-dual.log 2>/dev/null || true)"
                if test "$reconnect_count" -ge 2; then
                  reconnect_two=1
                  break
                fi
                sleep 0.1
              done
            fi
          fi

          if kill -0 "$qemu_pid" >/dev/null 2>&1; then
            kill "$qemu_pid" >/dev/null 2>&1 || true
          fi
          wait "$qemu_pid" >/dev/null 2>&1 || true

          cat build/qemu-hid-dual.log || true
          if test "$injection_failed" -ne 0; then
            echo '::error::Falha ao injetar eventos HID no monitor QEMU.'
            exit 1
          fi
          if test "$interleave_seen" -ne 1; then
            echo '::error::O kernel não publicou BAKEN:USB_HID_INTERLEAVE_READY.'
            exit 1
          fi
          if test "$runtime_ready" -ne 1; then
            echo '::error::O serviço HID-4d.6 não entrou no runtime nativo.'
            exit 1
          fi
          if test "$hotplug_failed" -ne 0 || test "$detach_two" -ne 1 || test "$reconnect_two" -ne 1; then
            echo '::error::A prova real device_del/device_add de HID-4d.6 não completou dois ciclos.'
            exit 1
          fi
          grep -q 'BAKEN:USB_HID_DUAL_READY' build/qemu-hid-dual.log
          grep -q 'BAKEN:USB_HID_INTERLEAVE_READY' build/qemu-hid-dual.log
          grep -q 'BAKEN:USB_HID_HOTPLUG_RUNTIME_READY' build/qemu-hid-dual.log
          test "$(grep -c 'BAKEN:USB_HID_HOTPLUG_DETACH_READY' build/qemu-hid-dual.log)" -ge 2
          test "$(grep -c 'BAKEN:USB_HID_HOTPLUG_RECONNECT_READY' build/qemu-hid-dual.log)" -ge 2

      - name: Upload HID dual-device diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: hid-dual-runtime-diagnostics
          path: |
            build/qemu-hid-dual.log
            build/sotlas-hid-dual.manifest.json
          if-no-files-found: ignore
