name: Baken OS MSI-X ivshmem Runtime Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  msix-ivshmem-runtime:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install QEMU and Sotlas build dependencies
        timeout-minutes: 20
        run: |
          ubuntu_sources=/etc/apt/sources.list.d/ubuntu.sources
          test -f "$ubuntu_sources"
          apt_retry() {
            local attempt=1
            while ! timeout --foreground 6m sudo apt-get \
              -o "Dir::Etc::sourcelist=${ubuntu_sources}" \
              -o Dir::Etc::sourceparts=- \
              -o Acquire::Retries=5 "$@"; do
              if test "$attempt" -ge 3; then
                echo "::error::apt-get $1 failed after $attempt attempts."
                return 1
              fi
              attempt=$((attempt + 1))
              sleep 10
            done
          }
          apt_retry update
          apt_retry install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64

      - name: Verify DF-7e2 structural contracts
        run: |
          python3 tests/test_pci_msix_ivshmem_proof.py
          python3 tests/test_pci_msix_activation.py
          python3 tests/test_pci_msix_table_programming.py
          python3 tests/test_pci_msix_reservation.py

      - name: Instrument CI-only MSI-X proof
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          cp tests/fixtures/df7e2/pci_msix_ivshmem_proof.sotlas \
             kernel/src/drivers/pci_msix_ivshmem_proof.sotlas

          python3 - <<'PY'
          from pathlib import Path

          fixture = Path("kernel/src/drivers/pci_msix_ivshmem_proof.sotlas")
          text = fixture.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              assert count == 1, f"expected one occurrence, got {count}: {old!r}"
              text = text.replace(old, new, 1)

          stage_replacements = {
              'pci_msix_ivshmem_trace("BAKEN:MSIX=BOUND\\n".as_ptr(), 17);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x10);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=TABLE\\n".as_ptr(), 17);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x20);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=ARMED\\n".as_ptr(), 17);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x30);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=EDGE\\n".as_ptr(), 16);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x41);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=SETTLED\\n".as_ptr(), 19);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x51);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=REMOVE_DISARM\\n".as_ptr(), 25);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x61);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=REMOVE_BARS\\n".as_ptr(), 23);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x62);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=UNBOUND\\n".as_ptr(), 19);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x70);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=RELEASED\\n".as_ptr(), 20);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x80);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=STALE\\n".as_ptr(), 17);':
                  "x86_serial_write_hex32_marker('X' as u8, 0x90);",
              'pci_msix_ivshmem_trace("BAKEN:MSIX=UNREGISTERED\\n".as_ptr(), 24);':
                  "x86_serial_write_hex32_marker('X' as u8, 0xA0);",
          }
          for old, new in stage_replacements.items():
              replace_once(old, new)

          runtime_replacements = [
              ("    if index == PCI_BRIDGE_INDEX_INVALID { return true; }\n",
               "    if index == PCI_BRIDGE_INDEX_INVALID {\n        x86_serial_write_hex32_marker('X' as u8, 0x01);\n        return true;\n    }\n"),
              ("    if !external_interrupts_enabled() { return false; }\n",
               "    if !external_interrupts_enabled() {\n        x86_serial_write_hex32_marker('X' as u8, 0x02);\n        return false;\n    }\n"),
              ("    if pci == (null as *const PciDevice) { return false; }\n",
               "    if pci == (null as *const PciDevice) {\n        x86_serial_write_hex32_marker('X' as u8, 0x03);\n        return false;\n    }\n"),
              ("    if reg_base == 0 || msix_base == 0 || reg_is_io || msix_is_io ||\n       (reg_base & 0xFF) != 0 || (msix_base & 0xFFF) != 0 {\n        return false;\n    }\n",
               "    if reg_base == 0 || msix_base == 0 || reg_is_io || msix_is_io ||\n       (reg_base & 0xFF) != 0 || (msix_base & 0xFFF) != 0 {\n        x86_serial_write_hex32_marker('X' as u8, 0x04);\n        x86_serial_write_hex32_marker('G' as u8, reg_base as u32);\n        x86_serial_write_hex32_marker('M' as u8, msix_base as u32);\n        return false;\n    }\n"),
              ("    if !device.valid { return false; }\n",
               "    if !device.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x05);\n        return false;\n    }\n"),
              ("    if !before_device.valid || before_device.state != DEVICE_STATE_ATTACHED ||\n       before_device.driver.valid { return false; }\n",
               "    if !before_device.valid || before_device.state != DEVICE_STATE_ATTACHED ||\n       before_device.driver.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x06);\n        x86_serial_write_hex32_marker('A' as u8, before_device.state as u32);\n        return false;\n    }\n"),
              ("    if !driver.valid { return false; }\n    unsafe {\n        PCI_MSIX_IVSHMEM_DRIVER = driver;\n",
               "    if !driver.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x07);\n        return false;\n    }\n    unsafe {\n        PCI_MSIX_IVSHMEM_DRIVER = driver;\n"),
              ("    if !driver_handle_equal(bound, driver) {\n        driver_unregister(driver);\n        return false;\n    }\n",
               "    if !driver_handle_equal(bound, driver) {\n        x86_serial_write_hex32_marker('X' as u8, 0x08);\n        driver_unregister(driver);\n        return false;\n    }\n"),
          ]
          for old, new in runtime_replacements:
              replace_once(old, new)

          replace_once(
              "fn pci_msix_ivshmem_probe(device: DeviceHandle) -> bool {\n    let driver = unsafe { PCI_MSIX_IVSHMEM_DRIVER };\n",
              "fn pci_msix_ivshmem_probe(device: DeviceHandle) -> bool {\n    x86_serial_write_hex32_marker('X' as u8, 0x09);\n    let driver = unsafe { PCI_MSIX_IVSHMEM_DRIVER };\n")
          replace_once(
              "    let driver = unsafe { PCI_MSIX_IVSHMEM_DRIVER };\n    if !driver.valid { return false; }\n\n    // DF-7b1 requires a generation-bound aperture proof before DF-7b can\n",
              "    let driver = unsafe { PCI_MSIX_IVSHMEM_DRIVER };\n    if !driver.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x0A);\n        return false;\n    }\n\n    // DF-7b1 requires a generation-bound aperture proof before DF-7b can\n")
          replace_once(
              "    if !sizing_claim.valid { return false; }\n",
              "    if !sizing_claim.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x0B);\n        return false;\n    }\n")
          replace_once(
              "    let sizing = pci_measure_owned_bar(device, driver, sizing_claim);\n    if !sizing.valid || sizing.size == 0 {\n        pci_release_bar(sizing_claim, device, driver);\n        return false;\n    }\n",
              "    let sizing = pci_measure_owned_bar(device, driver, sizing_claim);\n    x86_serial_write_hex32_marker('M' as u8, sizing.size as u32);\n    if !sizing.valid || sizing.size == 0 {\n        x86_serial_write_hex32_marker('X' as u8, 0x0C);\n        pci_release_bar(sizing_claim, device, driver);\n        return false;\n    }\n")
          replace_once(
              "    if !pci_release_bar(sizing_claim, device, driver) { return false; }\n",
              "    if !pci_release_bar(sizing_claim, device, driver) {\n        x86_serial_write_hex32_marker('X' as u8, 0x0D);\n        return false;\n    }\n")
          replace_once(
              "    if !msix_claim.valid { return false; }\n",
              "    if !msix_claim.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x0E);\n        x86_serial_write_hex32_marker('M' as u8, sizing.size as u32);\n        return false;\n    }\n")
          replace_once(
              "    if !reg_claim.valid {\n        pci_release_bar(msix_claim, device, driver);\n",
              "    if !reg_claim.valid {\n        x86_serial_write_hex32_marker('X' as u8, 0x0F);\n        pci_release_bar(msix_claim, device, driver);\n")
          replace_once(
              "    if pci_msix_reservation_is_ready(reservation) { return true; }\n",
              "    if pci_msix_reservation_is_ready(reservation) {\n        x86_serial_write_hex32_marker('X' as u8, 0xD0);\n        return true;\n    }\n")
          replace_once(
              "    if pci_msix_reservation_is_quarantined(reservation) { return true; }\n",
              "    if pci_msix_reservation_is_quarantined(reservation) {\n        x86_serial_write_hex32_marker('X' as u8, 0xD1);\n        return true;\n    }\n")
          replace_once(
              "    pci_release_bar(reg_claim, device, driver);\n    pci_release_bar(msix_claim, device, driver);\n",
              "    x86_serial_write_hex32_marker('X' as u8, 0xD2);\n    x86_serial_write_hex32_marker('L' as u8, reservation.state as u32);\n    pci_release_bar(reg_claim, device, driver);\n    pci_release_bar(msix_claim, device, driver);\n")

          anchor = "    let irq_before_doorbell = unsafe { PCI_MSIX_IVSHMEM_IRQ_COUNT };\n"
          replace_once(anchor, anchor + "    x86_serial_write_hex32_marker('B' as u8, irq_before_doorbell);\n")
          anchor = "    let first_delivered = unsafe { PCI_MSIX_IVSHMEM_IRQ_COUNT };\n"
          replace_once(anchor, anchor + "    x86_serial_write_hex32_marker('C' as u8, first_delivered);\n    x86_serial_write_hex32_marker('X' as u8, 0x40);\n")
          anchor = "    if stable_spins < PCI_MSIX_IVSHMEM_STABLE_SPINS { return false; }\n"
          replace_once(anchor, "    x86_serial_write_hex32_marker('S' as u8, stable_spins);\n    x86_serial_write_hex32_marker('s' as u8, settle_spins);\n    x86_serial_write_hex32_marker('X' as u8, 0x50);\n" + anchor)
          anchor = "    let vector = arm.reservation.vector;\n    if !driver_unbind(device, driver) { return false; }\n"
          replace_once(anchor, "    let vector = arm.reservation.vector;\n    x86_serial_write_hex32_marker('X' as u8, 0x60);\n    if !driver_unbind(device, driver) { return false; }\n")
          anchor = "    let attached = device_core_snapshot(device);\n    let released = unsafe { PCI_MSIX_IVSHMEM_ARM };\n"
          replace_once(anchor, anchor + "    x86_serial_write_hex32_marker('R' as u8, resource_active_count());\n    x86_serial_write_hex32_marker('r' as u8, before_resources);\n    x86_serial_write_hex32_marker('I' as u8, irq_registry_active_count());\n    x86_serial_write_hex32_marker('i' as u8, before_irqs);\n    x86_serial_write_hex32_marker('N' as u8, attached.resource_count);\n    x86_serial_write_hex32_marker('A' as u8, attached.state as u32);\n    x86_serial_write_hex32_marker('L' as u8, released.state as u32);\n")

          fixture.write_text(text, encoding="utf-8")
          PY

          python3 - <<'PY'
          from pathlib import Path
          path = Path("kernel/src/baken_native_runtime.sotlas")
          text = path.read_text(encoding="utf-8")
          import_anchor = "import kernel::device::foundation_self_test::*;\n"
          assert text.count(import_anchor) == 1
          text = text.replace(import_anchor, import_anchor + "import kernel::drivers::pci_msix_ivshmem_proof::*;\n", 1)
          call_anchor = (
              '    if !device_foundation_emit_ready_marker() && x86_serial_is_ready() {\n'
              '        baken_early_boot_fail("E-DF-MARKER\\0".as_ptr(), "DRIVER FOUNDATION SERIAL MARKER\\0".as_ptr());\n'
              '    }\n'
          )
          assert text.count(call_anchor) == 1
          proof = (
              '\n'
              '    // CI-only DF-7e2: QEMU ivshmem proves real MSI-X delivery + teardown.\n'
              '    baken_early_boot_stage("PCI MSIX IVSHMEM RUNTIME PROOF\\0".as_ptr());\n'
              '    if !pci_msix_ivshmem_runtime_proof() {\n'
              '        baken_early_boot_fail("E-MSIX-IVSHMEM\\0".as_ptr(), "PCI MSIX IVSHMEM RUNTIME PROOF\\0".as_ptr());\n'
              '    }\n'
          )
          text = text.replace(call_anchor, call_anchor + proof, 1)
          path.write_text(text, encoding="utf-8")
          PY

          grep -Fq 'import kernel::drivers::pci_msix_ivshmem_proof::*;' kernel/src/baken_native_runtime.sotlas
          grep -Fq 'pci_msix_ivshmem_runtime_proof()' kernel/src/baken_native_runtime.sotlas
          grep -Fq "x86_serial_write_hex32_marker('X' as u8, 0xD0);" kernel/src/drivers/pci_msix_ivshmem_proof.sotlas
          grep -Fq "x86_serial_write_hex32_marker('X' as u8, 0x60);" kernel/src/drivers/pci_msix_ivshmem_proof.sotlas

      - name: Verify instrumented Sotlas kernel graph
        run: |
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build instrumented native Sotlas UEFI kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-msix-ivshmem.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"

      - name: Build UEFI ISO image
        run: |
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Prove real MSI-X delivery and fail-closed teardown on ivshmem-doorbell
        timeout-minutes: 4
        shell: bash --noprofile --norc -e -o pipefail {0}
        run: |
          echo "MSI-X ivshmem proof revision $(git rev-parse HEAD)"
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          cp "$OVMF_VARS" build/OVMF_VARS_MSIX_IVSHMEM.fd
          rm -f build/ivshmem.sock build/ivshmem-server.ready build/qemu-msix-ivshmem-serial.log build/qemu-msix-ivshmem-int.log

          python3 tools/scripts/ivshmem_test_server.py --socket build/ivshmem.sock --ready build/ivshmem-server.ready &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do
            test -f build/ivshmem-server.ready && break
            sleep 0.05
          done
          test -f build/ivshmem-server.ready
          test -S build/ivshmem.sock

          qemu-system-x86_64 \
            -machine q35 -smp 2 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS_MSIX_IVSHMEM.fd \
            -cdrom build/baken_os.iso \
            -chardev socket,path=build/ivshmem.sock,id=ivshmem \
            -device ivshmem-doorbell,vectors=1,chardev=ivshmem \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none -monitor none \
            -serial file:build/qemu-msix-ivshmem-serial.log \
            -d int -D build/qemu-msix-ivshmem-int.log &
          qemu_pid=$!

          found=0
          stop_reason=timeout
          for i in $(seq 1 1500); do
            if test -f build/qemu-msix-ivshmem-serial.log && grep -Fxq 'BAKEN:PCI_MSIX_IVSHMEM_READY' build/qemu-msix-ivshmem-serial.log; then
              found=1; stop_reason=complete; break
            fi
            if test -f build/qemu-msix-ivshmem-serial.log && grep -Fq 'E-MSIX-IVSHMEM' build/qemu-msix-ivshmem-serial.log; then
              stop_reason=msix-ivshmem-failure; break
            fi
            if test -f build/qemu-msix-ivshmem-serial.log && grep -Fq 'BAKEN:HEX=E:' build/qemu-msix-ivshmem-serial.log; then
              stop_reason=cpu-exception; break
            fi
            if ! kill -0 "$qemu_pid" 2>/dev/null; then
              stop_reason=qemu-exited; break
            fi
            sleep 0.1
          done

          kill "$qemu_pid" 2>/dev/null || true
          wait "$qemu_pid" 2>/dev/null || true
          kill "$server_pid" 2>/dev/null || true
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT

          test -f build/qemu-msix-ivshmem-serial.log
          cat build/qemu-msix-ivshmem-serial.log
          echo "MSI-X ivshmem proof: stop_reason=${stop_reason}"
          grep -Fxq 'BAKEN:DRIVER_FOUNDATION_READY' build/qemu-msix-ivshmem-serial.log
          grep -Fxq 'BAKEN:PCI_MSIX_IVSHMEM_READY' build/qemu-msix-ivshmem-serial.log
          if grep -Fq 'BAKEN:HEX=E:' build/qemu-msix-ivshmem-serial.log; then
            echo '::error::CPU exception reported during MSI-X ivshmem proof.'
            tail -n 160 build/qemu-msix-ivshmem-int.log || true
            exit 1
          fi
          test "$found" -eq 1

      - name: Upload MSI-X ivshmem diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: qemu-msix-ivshmem-diagnostics
          path: |
            build/qemu-msix-ivshmem-serial.log
            build/qemu-msix-ivshmem-int.log
            build/sotlas-msix-ivshmem.manifest.json
          if-no-files-found: warn
          retention-days: 7
