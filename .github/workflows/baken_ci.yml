name: Baken OS CI/CD & Automated QEMU Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64

      - name: Run Complete Test Suite
        run: |
          python3 -m unittest discover -s tests

      - name: Verify Modular Sotlas Kernel Graph
        run: |
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build Native Sotlas UEFI Kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-main.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"

      - name: Build UEFI ISO Image
        run: |
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Run Headless QEMU Boot Smoke Test
        shell: bash
        run: |
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          cp "$OVMF_VARS" build/OVMF_VARS.fd
          rm -f build/qemu-serial.log

          set +e
          {
            sleep 4
            for i in $(seq 1 8); do
              echo "sendkey a"
              sleep 1
            done
            sleep 20
          } | timeout 15s qemu-system-x86_64 \
            -machine q35 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -cdrom build/baken_os.iso \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none \
            -monitor stdio \
            -serial file:build/qemu-serial.log
          status=${PIPESTATUS[1]}
          set -e

          if test -f build/qemu-serial.log; then
            cat build/qemu-serial.log
          fi
          test "$status" -eq 124
          grep -q "BAKEN:TIMER_READY" build/qemu-serial.log
          grep -q "BAKEN:STEP=T" build/qemu-serial.log
          grep -q "BAKEN:STEP=K" build/qemu-serial.log
          # STEP=X só aparece depois de discovery PCI pós-EBS, BAR0 UC,
          # capability validation, legacy handoff, halt, HCRST e CNR=0.
          grep -q "BAKEN:STEP=X" build/qemu-serial.log
          # STEP=D exige arena DMA real, DCBAAP/CRCR/ERST/ERDP programados,
          # readback válido e HCHalted ainda ativo. Bus Master continua off.
          grep -q "BAKEN:STEP=D" build/qemu-serial.log
          # STEP=N exige Bus Master, Run/Stop, Doorbell 0 e um Command Completion
          # Event real para o No-op Command no Event Ring xHCI.
          grep -q "BAKEN:STEP=N" build/qemu-serial.log
