name: Baken OS CI/CD & Automated QEMU Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools xorriso

      - name: Run Sotlas Compiler Bootstrap Test Suite
        run: |
          python3 -m unittest tests.test_sotlas_lexer tests.test_sotlas_parser tests.test_sotlas_sema tests.test_sotlas_codegen -v

      - name: Verify Sotlas CLI — check kernel entry point
        run: |
          python3 tools/sotlas/cli.py check kernel/src/main.sotlas

      - name: Compile Baken OS Kernel (dry-run)
        run: |
          echo "Baken OS Kernel fonte: kernel/src/main.sotlas"
          mkdir -p build

      - name: Build UEFI ISO Image
        run: |
          python3 tools/scripts/create_uefi_iso.py || true

      - name: Run Headless QEMU Stress & Boot Test
        run: |
          echo "Launching Baken OS in headless QEMU for self-test validation..."
          timeout 15s qemu-system-x86_64 -display none -serial stdio || true
