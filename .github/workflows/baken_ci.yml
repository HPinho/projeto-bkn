name: Baken OS CI/CD & Automated QEMU Verification

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install System Dependencies & QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools xorriso mingw-w64 socat

      - name: Run Complete Test Suite
        run: |
          python3 -m unittest discover -s tests

      - name: Verify Modular Sotlas Kernel Graph
        run: |
          python3 tools/sotlas_compile/compiler.py check kernel/src/main.sotlas

      - name: Build Native Sotlas UEFI Kernel
        run: |
          mkdir -p build/iso_root/EFI/BOOT
          SOTLAS_CC=x86_64-w64-mingw32-gcc python3 tools/sotlas_compile/compiler.py build \
            kernel/src/main.sotlas \
            --manifest build/sotlas-main.manifest.json \
            --output build/iso_root/EFI/BOOT/BOOTX64.EFI
          test "$(head -c 2 build/iso_root/EFI/BOOT/BOOTX64.EFI)" = "MZ"

      - name: Build UEFI ISO Image
        run: |
          python3 tools/scripts/create_uefi_iso.py
          test -s build/baken_os.iso

      - name: Run Headless QEMU Boot Smoke Test
        shell: bash
        run: |
          echo "BAKEN_CI_REVISION=$(git rev-parse --short HEAD)"
          command -v socat
          OVMF_CODE="$(find /usr/share -type f -name 'OVMF_CODE*.fd' | sort | head -n 1)"
          test -n "$OVMF_CODE"
          OVMF_VARS="${OVMF_CODE/CODE/VARS}"
          test -f "$OVMF_VARS"
          cp "$OVMF_VARS" build/OVMF_VARS.fd
          truncate -s 64M build/storage-test.img
          printf 'BAKENR01' | dd of=build/storage-test.img bs=1 seek=0 conv=notrunc status=none
          printf 'BAKENOLD' | dd of=build/storage-test.img bs=512 seek=1024 conv=notrunc status=none
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          path = Path("build/storage-test.img")
          block_size = 512
          size = path.stat().st_size
          assert size % block_size == 0
          last_lba = size // block_size - 1
          entry_count = 128
          entry_size = 128
          entries = bytearray(entry_count * entry_size)
          type_guid = bytes.fromhex("28732ac11ff8d211ba4b00a0c93ec93b")
          unique_guid = bytes.fromhex("78563412341278569abcdef012345678")
          disk_guid = bytes.fromhex("00112233445566778899aabbccddeeff")
          name = "BAKEN TEST".encode("utf-16le")
          name = name + bytes(72 - len(name))
          struct.pack_into(
              "<16s16sQQQ72s", entries, 0,
              type_guid, unique_guid, 2048, 4095, 0, name,
          )
          assert len(entries) % block_size == 0
          entry_blocks = len(entries) // block_size
          primary_entries_lba = 2
          entries_lba = last_lba - entry_blocks
          first_usable = 2048
          last_usable = entries_lba - 1
          entries_crc = zlib.crc32(entries) & 0xFFFFFFFF

          def make_header(current_lba, backup_lba, partition_entries_lba):
              header = bytearray(block_size)
              struct.pack_into(
                  "<8sIIIIQQQQ16sQIII", header, 0,
                  b"EFI PART", 0x00010000, 92, 0, 0,
                  current_lba, backup_lba, first_usable, last_usable,
                  disk_guid, partition_entries_lba, entry_count, entry_size, entries_crc,
              )
              header_crc = zlib.crc32(header[:92]) & 0xFFFFFFFF
              struct.pack_into("<I", header, 16, header_crc)
              return header

          primary_header = make_header(1, last_lba, primary_entries_lba)
          backup_header = make_header(last_lba, 1, entries_lba)

          with path.open("r+b") as image:
              image.seek(primary_entries_lba * block_size)
              image.write(entries)
              image.seek(1 * block_size)
              image.write(primary_header)
              image.seek(entries_lba * block_size)
              image.write(entries)
              image.seek(last_lba * block_size)
              image.write(backup_header)
          PY
          storage_last_lba=$(( $(stat -c%s build/storage-test.img) / 512 - 1 ))
          test "$(head -c 8 build/storage-test.img)" = "BAKENR01"
          test "$(dd if=build/storage-test.img bs=512 skip=1024 count=1 status=none | head -c 8)" = "BAKENOLD"
          test "$(dd if=build/storage-test.img bs=512 skip=1 count=1 status=none | head -c 8)" = "EFI PART"
          test "$(dd if=build/storage-test.img bs=512 skip="$storage_last_lba" count=1 status=none | head -c 8)" = "EFI PART"
          test -s build/storage-test.img
          rm -f build/qemu-serial.log
          rm -f build/qemu-monitor.sock

          set +e
          timeout --signal=TERM --kill-after=5s 60s qemu-system-x86_64 \
            -machine q35 -m 512M -no-reboot \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=build/OVMF_VARS.fd \
            -drive file=build/storage-test.img,format=raw,if=ide,index=0 \
            -cdrom build/baken_os.iso \
            -device qemu-xhci,id=xhci \
            -device usb-kbd,bus=xhci.0 \
            -display none \
            -monitor unix:build/qemu-monitor.sock,server=on,wait=off \
            -serial file:build/qemu-serial.log &
          qemu_pid=$!

          for i in $(seq 1 50); do
            test -S build/qemu-monitor.sock && break
            sleep 0.1
          done
          test -S build/qemu-monitor.sock

          injection_failed=0
          for i in $(seq 1 20); do
            if ! printf 'sendkey a\n' | socat - UNIX-CONNECT:build/qemu-monitor.sock >/dev/null 2>&1; then
              injection_failed=1
              break
            fi
            sleep 2
          done
          wait "$qemu_pid"
          status=$?
          set -e

          if test -f build/qemu-serial.log; then
            cat build/qemu-serial.log
          fi
          test "$injection_failed" -eq 0
          test "$status" -eq 124
          test "$(dd if=build/storage-test.img bs=512 skip=1024 count=1 status=none | head -c 8)" = "BAKENW01"
          test "$(dd if=build/storage-test.img bs=512 skip=1 count=1 status=none | head -c 8)" = "EFI PART"
          test "$(dd if=build/storage-test.img bs=512 skip="$storage_last_lba" count=1 status=none | head -c 8)" = "EFI PART"
          python3 - <<'PY'
          from pathlib import Path
          import struct
          import zlib

          path = Path("build/storage-test.img")
          block_size = 512
          last_lba = path.stat().st_size // block_size - 1

          def read_header(image, lba):
              image.seek(lba * block_size)
              header = image.read(block_size)
              assert header[:8] == b"EFI PART"
              expected_header_crc = struct.unpack_from("<I", header, 16)[0]
              header_for_crc = bytearray(header)
              struct.pack_into("<I", header_for_crc, 16, 0)
              assert zlib.crc32(header_for_crc[:92]) & 0xFFFFFFFF == expected_header_crc
              return header

          with path.open("rb") as image:
              primary = read_header(image, 1)
              backup = read_header(image, last_lba)

              assert struct.unpack_from("<Q", primary, 24)[0] == 1
              assert struct.unpack_from("<Q", primary, 32)[0] == last_lba
              assert struct.unpack_from("<Q", backup, 24)[0] == last_lba
              assert struct.unpack_from("<Q", backup, 32)[0] == 1
              assert primary[56:72] == backup[56:72]
              assert primary[40:56] == backup[40:56]
              assert primary[80:92] == backup[80:92]

              primary_entries_lba = struct.unpack_from("<Q", primary, 72)[0]
              entries_lba = struct.unpack_from("<Q", backup, 72)[0]
              entry_count = struct.unpack_from("<I", backup, 80)[0]
              entry_size = struct.unpack_from("<I", backup, 84)[0]
              expected_crc = struct.unpack_from("<I", backup, 88)[0]
              entries_bytes = entry_count * entry_size

              image.seek(primary_entries_lba * block_size)
              primary_entries = image.read(entries_bytes)
              image.seek(entries_lba * block_size)
              entries = image.read(entries_bytes)

          assert len(entries) == entries_bytes
          assert len(primary_entries) == entries_bytes
          assert entries[:16] != bytes(16)
          assert primary_entries == entries
          assert zlib.crc32(entries) & 0xFFFFFFFF == expected_crc
          assert zlib.crc32(primary_entries) & 0xFFFFFFFF == expected_crc
          esp_type_guid = bytes.fromhex("28732ac11ff8d211ba4b00a0c93ec93b")
          esp_unique_guid = bytes.fromhex("78563412341278569abcdef012345678")
          assert primary_entries[:16] == esp_type_guid
          assert primary_entries[16:32] == esp_unique_guid
          assert struct.unpack_from("<Q", primary_entries, 32)[0] == 2048
          assert struct.unpack_from("<Q", primary_entries, 40)[0] == 4095
          assert struct.unpack_from("<Q", primary_entries, 48)[0] == 0
          PY
          for marker in TIMER_READY STEP=T STEP=K STEP=X STEP=D STEP=N STEP=U STEP=S STEP=Y STEP=Z STEP=Q STEP=E STEP=F STEP=G STEP=H STEP=M STEP=L STEP=O STEP=W STEP=a STEP=b STEP=c STEP=d STEP=e STEP=f STEP=k STEP=v STEP=i STEP=n STEP=t STEP=m STEP=J; do
            if ! grep -q "BAKEN:${marker}" build/qemu-serial.log; then
              echo "::error::QEMU não alcançou BAKEN:${marker}; consulte o artefato qemu-boot-diagnostics."
              exit 1
            fi
          done

      - name: Upload QEMU boot diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-boot-diagnostics
          path: build/qemu-serial.log
          if-no-files-found: warn
          retention-days: 7
